# ============================================================================
# WZ UW IntraLex — Rejestr aktów do pobrania z konkretnych URLi
# ============================================================================
# Ten plik zawiera akty, które nie są automatycznie wykrywane przez scrapery
# Monitor UW ani WZ UW. Są to dokumenty fundamentalne (regulaminy, statut)
# oraz akty wydziałowe dostępne pod konkretnymi adresami.
#
# Każdy wpis ma:
#   id:          unikalny identyfikator (prefiks "direct_")
#   tytul:       pełna nazwa aktu
#   organ:       organ wydający (Senat, Rektor, Rada Dydaktyczna, KJD, Dziekan)
#   typ:         typ aktu (uchwała, zarządzenie, regulamin, obwieszczenie)
#   rok:         rok wydania/uchwalenia
#   data_wydania: data w formacie YYYY-MM-DD (jeśli znana)
#   url_pdf:     bezpośredni link do PDF
#   url_page:    strona, na której akt jest opublikowany (do wyświetlenia jako źródło)
#   kategoria:   tag tematyczny (studia, pomoc_materialna, dyplomowanie, organizacja, opłaty, praktyki)
#   uwagi:       opcjonalne notatki
# ============================================================================

akty:

